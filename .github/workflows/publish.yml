name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.9.0
          cache: npm

      - name: Install npm 12.1.0
        run: npm install --global npm@12.1.0

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: latest

      - name: Build application
        run: |
          if node -e 'const p=require("./package.json");process.exit(p.scripts?.["build:bun"]?0:1)'; then
            bun run build:bun
          else
            npm run build
          fi

      - name: Build release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/build-release-asset.mjs "$VERSION"
          cp install.sh install.ps1 scripts/install-release.mjs dist/
          cd dist
          sha256sum ompweb-v"$VERSION".tar.gz install.sh install.ps1 install-release.mjs > SHA256SUMS

      - name: Publish immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/ompweb-*.tar.gz dist/SHA256SUMS dist/install.sh dist/install.ps1 dist/install-release.mjs
